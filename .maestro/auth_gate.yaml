# E2E for the auth gate and the post-login landing.
#
# The Hugo site is the public face now, so this app is anonymous ONLY on
# /login and the Welcome pack. Two things this proves, both of which broke
# silently in the old arrangement:
#   1. An anonymous deep link into the directory lands on /login.
#   2. A successful login lands on the Welcome pack, not the directory.
#
# The app must be served from a build made WITH semantics, or Maestro sees only
# a bare canvas (Flutter web draws to a <canvas>):
#   flutter build web --dart-define=E2E=true
#   python3 -m http.server 8123 --directory build/web
#   maestro test .maestro/auth_gate.yaml --env-file .maestro/.env
url: http://localhost:8123
name: "Auth gate: anonymous is bounced, login lands on the Welcome pack"
env:
  BASE_URL: http://localhost:8123
---
# clearState avoids a stale main.dart.js being served from cache — without it a
# rebuilt app silently isn't the one under test. It also drops any persisted
# GoTrue session, which is what makes the next step genuinely anonymous.
- clearState

# 1. Anonymous deep link into the directory → bounced to /login.
- openLink: "${BASE_URL}/#/people"
- extendedWaitUntil:
    visible: "Password"
    timeout: 30000
    label: "Anonymous /people was bounced to the login screen"
- assertNotVisible:
    text: "1\\d\\d people"
    label: "The directory never rendered for an anonymous visitor"

# 2. The Welcome pack stays anonymous — it's how a researcher arrives from the
#    public site before they have an account.
- openLink: "${BASE_URL}/#/app/welcome/start"
- extendedWaitUntil:
    visible: "Your first 5 steps"
    timeout: 20000
    label: "Welcome pack is reachable without a session"
# Every other nav target is gated, so an anonymous visitor must not be offered
# them: AppShell's directory nav and PortalShell's first three tabs both used
# to render regardless of session, giving five links that all bounce to /login.
#
# "Overview", not "Support requests": that tab is behind the v2 flag now, so
# asserting it is absent passes in a v1 build whatever the session does, and
# proves nothing. Overview is session-only and present in both builds.
- assertNotVisible:
    text: "^Overview$"
    label: "No gated portal tab offered to an anonymous visitor"
- assertNotVisible:
    text: "^Structure$"
    label: "No directory nav offered to an anonymous visitor"

# 3. Sign in → land on the Welcome pack.
- openLink: "${BASE_URL}/#/login"
- extendedWaitUntil:
    visible: "Email"
    timeout: 20000
# inputText occasionally races the focus change and lands nowhere, leaving the
# field empty; the run then fails several steps later on "missing email or
# phone", which reads like a credentials problem. Retry until the text is
# actually in the field.
- repeat:
    times: 3
    while:
      notVisible: "${MAESTRO_EMAIL}"
    commands:
      - tapOn:
          id: "Email"
      - inputText: "${MAESTRO_EMAIL}"
- assertVisible:
    text: "${MAESTRO_EMAIL}"
    label: "Email landed in the field"
- tapOn:
    id: "Password"
- inputText: "${MAESTRO_PASSWORD}"
# "Sign in" also names this screen's AppBar title, so anchor to the field above.
- tapOn:
    text: "Sign in"
    below:
      id: "Password"
# An account holding the admin role is asked which job it is doing before it
# lands anywhere. Every account in the system currently holds it, including the
# E2E one — so this branch is the live path, and the `when` only guards against
# the day a genuine researcher account exists.
- runFlow:
    when:
      visible: "Continue as researcher"
    commands:
      - tapOn: "Continue as researcher"
- extendedWaitUntil:
    visible: "Your first 5 steps"
    timeout: 20000
    label: "Login landed on the Welcome pack"

# 4. With a session, the researcher's own portal opens. The unit-wide directory
#    is admin mode's, and admin_mode.yaml is what proves it opens there.
- openLink: "${BASE_URL}/#/app/home"
- extendedWaitUntil:
    visible: "OUTPUTS"
    timeout: 20000
    label: "Signed in, the researcher's own overview is reachable"
