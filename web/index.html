<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="UNIDCOM/IADE researcher portal — profile, publications and support requests.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="unidcom_iade">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>unidcom_iade</title>
  <link rel="manifest" href="manifest.json">
  <style>
    #splash {
      align-items: center;
      background: #F5F4F0;
      color: #16213A;
      display: flex;
      flex-direction: column;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      height: 100vh;
      justify-content: center;
      width: 100vw;
    }
    #splash strong {
      font-size: 1.5rem;
      letter-spacing: 0.08em;
    }
    #splash p {
      color: #6A6862;
      margin: 0.5rem 0 1.5rem;
    }
    #splash .spinner {
      animation: splash-spin 0.8s linear infinite;
      border: 3px solid rgba(10, 122, 104, 0.2);
      border-radius: 50%;
      border-top-color: #0A7A68;
      height: 1.5rem;
      width: 1.5rem;
    }
    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-label="Loading UNIDCOM IADE">
    <strong>UNIDCOM IADE</strong>
    <p>Research Information Management</p>
    <div class="spinner" aria-hidden="true"></div>
  </div>
  <script>
    const splash = document.getElementById('splash');
    const removeSplash = () => splash?.remove();
    window.addEventListener('flutter-first-frame', removeSplash, { once: true });
    window.setTimeout(removeSplash, 20000);
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
