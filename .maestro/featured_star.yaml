# E2E for the profile "highlight" star: log in, star an output, confirm it
# persists across a reload, then unstar so the live DB ends as it started.
#
# The app must be served from a build made WITH semantics, or Maestro sees only
# a bare canvas (Flutter web draws to a <canvas>):
#   flutter build web --dart-define=E2E=true
#   python3 -m http.server 8123 --directory build/web
#   maestro test .maestro/featured_star.yaml --env-file .maestro/.env
#
# Selectors are text, not ids: Semantics(identifier:) does NOT reach the web
# semantics tree, but TextField labels and IconButton tooltips both do.
#
# If a run dies between the star and the unstar it leaves one output starred.
# Reset with:  update people set featured_outputs = '{}' where id = '<TEST_PERSON_ID>';
url: http://localhost:8123
name: Highlight an output on a person page
env:
  BASE_URL: http://localhost:8123
  TEST_PERSON_ID: b455c1be-4686-5016-91f4-0b19f0d0a6ae # Ana Nolasco, 7 outputs
---
# clearState avoids a stale main.dart.js being served from cache — without it a
# rebuilt app silently isn't the one under test.
- clearState
- openLink: "${BASE_URL}/#/login"
- extendedWaitUntil:
    visible: "Email"
    timeout: 20000

# inputText occasionally races the focus change and lands nowhere, leaving the
# field empty; the run then fails several steps later on "missing email or
# phone", which reads like a credentials problem. Retry until the text is
# actually in the field.
- repeat:
    times: 3
    while:
      notVisible: "${MAESTRO_EMAIL}"
    commands:
      - tapOn:
          id: "Email"
      - inputText: "${MAESTRO_EMAIL}"
- assertVisible:
    text: "${MAESTRO_EMAIL}"
    label: "Email landed in the field"
- tapOn:
    id: "Password"
- inputText: "${MAESTRO_PASSWORD}"
# "Sign in" also names this screen's AppBar title, so anchor to the field above.
- tapOn:
    text: "Sign in"
    below:
      id: "Password"

# Landing on the Welcome pack is the only proof the credentials were accepted.
- extendedWaitUntil:
    visible: "Your first 5 steps"
    timeout: 20000

- openLink: "${BASE_URL}/#/people/${TEST_PERSON_ID}"
# About proves the person data loaded. scrollUntilVisible doesn't move the
# Flutter-web canvas, so we swipe-until-visible instead (star rows live in the
# timeline, below the fold).
- extendedWaitUntil:
    visible: "About"
    timeout: 20000
- repeat:
    times: 10
    while:
      notVisible: "Highlight on profile"
    commands:
      - swipe:
          direction: UP
          duration: 400
- assertVisible:
    text: "Highlight on profile"
    label: "Starts unstarred"

- tapOn:
    text: "Highlight on profile"
    index: 0
# The refetch after the write can reset scroll to the top — swipe back down.
- repeat:
    times: 10
    while:
      notVisible: "Remove highlight"
    commands:
      - swipe:
          direction: UP
          duration: 400
- assertVisible:
    text: "Remove highlight"
    label: "Write + refetch round-tripped"

# Reload from scratch: proves it was persisted, not just local widget state.
# (openLink to the SAME hash URL is a no-op — bounce via the list first.)
- openLink: "${BASE_URL}/#/people"
- extendedWaitUntil:
    visible: "1\\d\\d people"
    timeout: 20000
- openLink: "${BASE_URL}/#/people/${TEST_PERSON_ID}"
- extendedWaitUntil:
    visible: "About"
    timeout: 20000
- repeat:
    times: 10
    while:
      notVisible: "Remove highlight"
    commands:
      - swipe:
          direction: UP
          duration: 400
- assertVisible:
    text: "Remove highlight"
    label: "Survived a reload"

- tapOn:
    text: "Remove highlight"
    index: 0
- repeat:
    times: 10
    while:
      notVisible: "Highlight on profile"
    commands:
      - swipe:
          direction: UP
          duration: 400
- assertVisible:
    text: "Highlight on profile"
    label: "Unstarred again — live data restored"
